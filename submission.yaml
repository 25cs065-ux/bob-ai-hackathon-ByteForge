submission:
  title: "Threat Intelligence Correlation & Alert Prioritisation Assistant"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Defence analysts receive thousands of alerts daily from SIEM systems,
    satellite feeds, cyber sensors, and intelligence reports, all in different
    formats — no human team can read them all. Missing a genuine threat is
    catastrophic, while chasing false positives wastes critical resources,
    and commanders need threat assessments in a clear, structured format
    within minutes, not hours.


  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Our solution ingests multi-source threat feeds, normalizes and correlates
    related alerts into single incidents, scores and prioritizes them using
    AI-driven risk and behavioural analysis, maps attacker techniques to the
    MITRE ATT&CK framework, and generates prioritised BLUF (Bottom Line Up
    Front) investigation summaries so commanders get a clear threat picture
    in minutes.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-driven multi-source alert correlation and incident clustering (SIEM, sensors, intel reports, satellite feeds)"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Dynamic risk scoring, prioritisation, and Threat DNA behavioural fingerprinting to catch attackers who change IP/malware"
    - "MITRE ATT&CK technique mapping with Cyber-Physical Threat Fusion linking cyber alerts to satellite/geospatial signals"
    - "AI Investigation Assistant and auto-generated BLUF reports with predictive kill-chain forecasting of the attacker's next move"                               # optional 4th
    - ""                               # optional 5th

  tech_stack:
    languages: ["Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The Threat DNA behavioural fingerprinting and Cyber-Physical Threat Fusion
    features go beyond standard signature-based correlation — they detect
    attackers who evade detection by changing infrastructure, and fuse cyber
    alerts with physical/satellite signals to give commanders a genuinely
    unified threat picture.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Built within a 2-day hackathon window — threat intelligence enrichment
    and live external feeds are simulated/mocked rather than connected to
    real production data sources, and the dashboard covers core workflows
    rather than the full analyst toolset.

